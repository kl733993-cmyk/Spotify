<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader - Live Terminal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            color: #1DB954;
        }
        p {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #1DB954;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #1aa34a;
        }
        #log {
            margin-top: 20px;
            background: #000;
            color: #00ff66;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Spotify Downloader</h2>
        <p>Live Processing Status Tracker</p>
        
        <form id="downloadForm">
            <input type="text" id="url" name="url" placeholder="https://open.spotify.com/track/..." required autocomplete="off">
            <button type="submit" id="subBtn">Start Processing</button>
        </form>

        <div id="log"></div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const logBox = document.getElementById('log');
        const subBtn = document.getElementById('subBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlVal = document.getElementById('url').value;
            
            logBox.style.display = 'block';
            logBox.textContent = "[*] Connecting to server...\n";
            subBtn.disabled = true;
            subBtn.textContent = "Processing...";

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'url=' + encodeURIComponent(urlVal)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    logBox.textContent += decoder.decode(value, { stream: true });
                    logBox.scrollTop = logBox.scrollHeight;
                }
            } catch (err) {
                logBox.textContent += "\n[-] Connection failed: " + err;
            } finally {
                subBtn.disabled = false;
                subBtn.textContent = "Start Processing";
            }
        });
    </script>

</body>
</html>
